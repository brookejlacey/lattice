<svg xmlns="http://www.w3.org/2000/svg" width="960" height="320" viewBox="0 0 960 320" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
  <defs>
    <radialGradient id="agentGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0 L0 0 0 30" fill="none" stroke="#8b5cf6" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="960" height="320" rx="16" fill="#0a0a1a"/>
  <rect width="960" height="320" rx="16" fill="url(#grid)"/>

  <!-- ============ PANEL 1: empty lattice ============ -->
  <g transform="translate(160,150)">
    <circle r="34" fill="url(#agentGlow)"/>
    <circle r="20" fill="#8b5cf6"/>
    <text y="5" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">L</text>
    <text y="60" text-anchor="middle" fill="#c4b5fd" font-size="11">LATTICE</text>
    <text y="-92" text-anchor="middle" fill="#71717a" font-size="12">0 edges</text>
    <text y="92" text-anchor="middle" fill="#52525b" font-size="11">starts with zero access</text>
  </g>

  <!-- ============ PANEL 2: +GitHub ============ -->
  <g transform="translate(480,150)">
    <!-- edge to github -->
    <line x1="0" y1="0" x2="0" y2="-78" stroke="#8b5cf6" stroke-opacity="0.6" stroke-width="2"/>
    <circle r="34" fill="url(#agentGlow)"/>
    <circle r="20" fill="#8b5cf6"/>
    <text y="5" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">L</text>
    <text y="60" text-anchor="middle" fill="#c4b5fd" font-size="11">LATTICE</text>
    <!-- github node -->
    <g transform="translate(0,-78)">
      <circle r="16" fill="#8b5cf6"/>
      <text y="4" text-anchor="middle" fill="#fff" font-size="10" font-weight="bold">GH</text>
    </g>
    <text y="-108" text-anchor="middle" fill="#71717a" font-size="12">+ GitHub</text>
    <text y="92" text-anchor="middle" fill="#52525b" font-size="11">acquires a token at runtime</text>
  </g>

  <!-- ============ PANEL 3: +Google +Slack ============ -->
  <g transform="translate(800,150)">
    <!-- edges -->
    <line x1="0" y1="0" x2="0" y2="-78" stroke="#8b5cf6" stroke-opacity="0.6" stroke-width="2"/>
    <line x1="0" y1="0" x2="68" y2="40" stroke="#4285f4" stroke-opacity="0.6" stroke-width="2"/>
    <line x1="0" y1="0" x2="-68" y2="40" stroke="#e01e5a" stroke-opacity="0.6" stroke-width="2"/>
    <circle r="34" fill="url(#agentGlow)"/>
    <circle r="20" fill="#8b5cf6"/>
    <text y="5" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">L</text>
    <text y="60" text-anchor="middle" fill="#c4b5fd" font-size="11">LATTICE</text>
    <!-- github -->
    <g transform="translate(0,-78)">
      <circle r="16" fill="#8b5cf6"/>
      <text y="4" text-anchor="middle" fill="#fff" font-size="10" font-weight="bold">GH</text>
    </g>
    <!-- google -->
    <g transform="translate(68,40)">
      <circle r="16" fill="#4285f4"/>
      <text y="4" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">G</text>
    </g>
    <!-- slack -->
    <g transform="translate(-68,40)">
      <circle r="16" fill="#e01e5a"/>
      <text y="4" text-anchor="middle" fill="#fff" font-size="10" font-weight="bold">SL</text>
    </g>
    <text y="-108" text-anchor="middle" fill="#71717a" font-size="12">+ Google + Slack</text>
    <text y="92" text-anchor="middle" fill="#52525b" font-size="11">the lattice grows as it works</text>
  </g>

  <!-- progression arrows -->
  <text x="320" y="156" text-anchor="middle" fill="#3f3f46" font-size="22">&#8594;</text>
  <text x="640" y="156" text-anchor="middle" fill="#3f3f46" font-size="22">&#8594;</text>
</svg>
